<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VeriScope</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cyan:   #00f5ff;
            --blue:   #0066ff;
            --green:  #00ff88;
            --red:    #ff2244;
            --bg:     #020810;
            --panel:  rgba(4, 16, 32, 0.85);
            --border: rgba(0, 245, 255, 0.18);
            --text:   #cce8ff;
            --dim:    rgba(150, 200, 255, 0.5);
            --mono:   'Share Tech Mono', monospace;
            --head:   'Rajdhani', sans-serif;
        }

        body {
            font-family: var(--head);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.06) 2px,
                rgba(0,0,0,0.06) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        .corner {
            position: fixed;
            width: 60px; height: 60px;
            z-index: 2;
            opacity: 0.4;
        }
        .corner::before, .corner::after { content: ''; position: absolute; background: var(--cyan); }
        .corner::before { width: 2px; height: 100%; }
        .corner::after  { width: 100%; height: 2px; }
        .corner.tl { top: 16px; left: 16px; }
        .corner.tr { top: 16px; right: 16px; transform: scaleX(-1); }
        .corner.bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
        .corner.br { bottom: 16px; right: 16px; transform: scale(-1); }

        .threat-hud {
            position: fixed;
            top: 20px; right: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: rgba(0,245,255,0.3);
            text-align: right;
            z-index: 2;
            line-height: 1.9;
            letter-spacing: 1px;
        }
        .threat-hud .val    { color: rgba(0,255,136,0.5); }
        .threat-hud .danger { color: rgba(255,34,68,0.5); }

        .hud-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: rgba(0,245,255,0.25);
            letter-spacing: 2px;
            z-index: 2;
            white-space: nowrap;
        }

        .login-wrap {
            position: relative;
            z-index: 10;
            perspective: 1200px;
        }

        .login-card {
            width: 420px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 44px 40px 36px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow:
                0 0 0 1px rgba(0,245,255,0.05),
                0 0 100px rgba(0,100,255,0.1),
                0 40px 80px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(0,245,255,0.1);
            animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
            transform-style: preserve-3d;
            transition: transform 0.12s ease-out;
            position: relative;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) rotateX(10deg); }
            to   { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
            opacity: 0.5;
        }
        .login-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,100,255,0.4), transparent);
        }

        /* Shield */
        .logo-wrap {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeUp 0.6s 0.2s both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .shield-3d {
            width: 68px; height: 68px;
            margin: 0 auto 14px;
            position: relative;
            animation: shieldFloat 4s ease-in-out infinite;
        }
        @keyframes shieldFloat {
            0%,100% { transform: translateY(0) rotateY(0deg); }
            33%     { transform: translateY(-5px) rotateY(10deg); }
            66%     { transform: translateY(-2px) rotateY(-8deg); }
        }
        .shield-3d svg {
            width: 68px; height: 68px;
            filter: drop-shadow(0 0 14px rgba(0,245,255,0.7)) drop-shadow(0 0 40px rgba(0,100,255,0.4));
        }
        .shield-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0,245,255,0.2);
            animation: pulseRing 2.5s ease-out infinite;
        }
        .shield-ring.r1 { inset: -10px; }
        .shield-ring.r2 { inset: -22px; animation-delay: 0.85s; }
        @keyframes pulseRing {
            0%   { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 0;   transform: scale(1.5); }
        }

        .logo-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .logo-title span { color: var(--cyan); }
        .logo-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--dim);
            letter-spacing: 3px;
            margin-top: 5px;
        }

        .section-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: rgba(0,245,255,0.4);
            letter-spacing: 3px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeUp 0.6s 0.3s both;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,245,255,0.2), transparent);
        }

        /* Google button */
        .google-btn {
            width: 100%;
            padding: 13px 18px;
            background: rgba(0,245,255,0.04);
            border: 1px solid rgba(0,245,255,0.2);
            border-radius: 3px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.22s;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s 0.4s both;
        }
        .google-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,245,255,0.07), transparent);
            transition: left 0.5s;
        }
        .google-btn:hover {
            border-color: rgba(0,245,255,0.5);
            box-shadow: 0 0 24px rgba(0,245,255,0.08), inset 0 0 20px rgba(0,245,255,0.04);
            color: #fff;
        }
        .google-btn:hover::after { left: 160%; }
        .google-btn:active { transform: scale(0.99); }

        /* Selected account */
        #selected-account-card {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(0,245,255,0.04);
            border: 1px solid rgba(0,245,255,0.15);
            border-radius: 3px;
            margin-bottom: 12px;
        }
        #selected-account-card img {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(0,245,255,0.3);
        }
        .acc-info { flex: 1; overflow: hidden; }
        .acc-name  { font-size: 14px; font-weight: 600; color: var(--text); }
        .acc-email { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .change-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--cyan);
            background: none; border: none; cursor: pointer;
            letter-spacing: 1px;
        }
        .change-btn:hover { text-decoration: underline; }

        /* Continue button */
        #google-continue-btn {
            display: none;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, rgba(0,100,255,0.28), rgba(0,245,255,0.18));
            border: 1px solid rgba(0,245,255,0.35);
            border-radius: 3px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.22s;
            box-shadow: 0 0 24px rgba(0,100,255,0.18);
        }
        #google-continue-btn:hover {
            background: linear-gradient(135deg, rgba(0,100,255,0.5), rgba(0,245,255,0.32));
            box-shadow: 0 0 36px rgba(0,245,255,0.2);
        }
        #google-continue-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--dim);
            animation: fadeUp 0.6s 0.5s both;
        }
        .footer-text a {
            color: var(--cyan);
            text-decoration: none;
            transition: all 0.2s;
        }
        .footer-text a:hover { color: #fff; text-shadow: 0 0 10px var(--cyan); }

        #error-msg {
            display: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--red);
            margin-bottom: 14px;
            padding: 10px 14px;
            background: rgba(255,34,68,0.08);
            border: 1px solid rgba(255,34,68,0.25);
            border-radius: 3px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="threat-hud">
    <div>SYSTEM&nbsp;&nbsp;<span class="val" id="hud-status">SECURE</span></div>
    <div>THREATS&nbsp;<span class="danger" id="hud-threats">0</span></div>
    <div>UPTIME&nbsp;&nbsp;<span class="val" id="hud-uptime">00:00:00</span></div>
</div>
<div class="hud-bar">VERISCOPE AI · PHISHING DETECTION SYSTEM · v2.1.4 · AES-256 ENCRYPTED</div>

<div class="login-wrap">
    <div class="login-card" id="loginCard">

        <div class="logo-wrap">
            <div class="shield-3d">
                <div class="shield-ring r1"></div>
                <div class="shield-ring r2"></div>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f5ff"/>
                            <stop offset="100%" stop-color="#0066ff"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="url(#sg)" opacity="0.9"/>
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="none" stroke="rgba(0,245,255,0.4)" stroke-width="0.5"/>
                    <path d="M10 12l2 2 4-4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="logo-title">Veri<span>Scope</span></div>
            <div class="logo-sub">THREAT INTELLIGENCE PLATFORM</div>
        </div>

        <div id="error-msg"></div>

        <div class="section-label">AUTHENTICATE</div>

        <div id="email-section">
            <button class="google-btn" id="google-btn" onclick="startGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>

            <div id="selected-account-card">
                <img id="acc-avatar" src="" alt="">
                <div class="acc-info">
                    <div class="acc-name" id="acc-name"></div>
                    <div class="acc-email" id="acc-email"></div>
                </div>
                <button class="change-btn" onclick="changeAccount()">[ CHANGE ]</button>
            </div>

            <button id="google-continue-btn" onclick="submitToken()">▶ CONTINUE</button>

            <div class="footer-text">
                No account? <a href="/register">Create one →</a>
            </div>
        </div>
    </div>
</div>

<!-- Hidden Google SDK trigger -->
<div style="position:absolute;left:-9999px;top:-9999px;overflow:hidden;width:1px;height:1px;">
    <div id="g_id_onload"
         data-client_id="93245967028-gvs3jtmhmep0mlc72n3t18mifp2d52pr.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false"
         data-ux_mode="popup">
    </div>
    <div class="g_id_signin" id="hidden-g-btn" data-type="standard" data-size="large" data-width="200"></div>
</div>

<script>
/* ═══════════════════════════════════════════════
   3D ANIMATED BACKGROUND
═══════════════════════════════════════════════ */
(function() {
    const canvas = document.getElementById('bg-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H;
    const COLS = 14, ROWS = 9;
    let nodes = [], particles = [], scanY = 0;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function initGrid() {
        nodes = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                nodes.push({
                    x3: (c / (COLS - 1) - 0.5) * 2,
                    y3: (r / (ROWS - 1) - 0.5) * 1.2,
                    z3: 0,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.3 + Math.random() * 0.4,
                    active: Math.random() < 0.14
                });
            }
        }
    }

    function project(x3, y3, z3, t) {
        const fov = 1.8;
        const ry  = Math.sin(t * 0.00025) * 0.1;
        const x2  = x3 * Math.cos(ry) - z3 * Math.sin(ry);
        const z2  = x3 * Math.sin(ry) + z3 * Math.cos(ry);
        const y2  = y3 + z2 * 0.16;
        const sc  = fov / (fov + z2 + 1);
        return { x: W * 0.5 + x2 * W * 0.46 * sc, y: H * 0.5 + y2 * H * 0.43 * sc, s: sc };
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: Math.random() * (typeof W !== 'undefined' ? W : 1920),
                y: Math.random() * (typeof H !== 'undefined' ? H : 1080),
                size: 3 + Math.random() * 9,
                vx: (Math.random() - 0.5) * 0.28,
                vy: -0.18 - Math.random() * 0.4,
                alpha: 0.07 + Math.random() * 0.15,
                hex: Math.random() < 0.55,
                rot: Math.random() * Math.PI
            });
        }
    }

    function drawHex(x, y, r, rot) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a  = rot + i * Math.PI / 3;
            const px = x + r * Math.cos(a);
            const py = y + r * Math.sin(a);
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
    }

    function draw(t) {
        ctx.clearRect(0, 0, W, H);

        /* Background */
        const bg = ctx.createRadialGradient(W * 0.5, H * 0.38, 0, W * 0.5, H * 0.38, W * 0.72);
        bg.addColorStop(0,   'rgba(0,20,50,0.96)');
        bg.addColorStop(0.5, 'rgba(2,8,22,0.98)');
        bg.addColorStop(1,   'rgba(2,6,16,1)');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        /* Grid lines + nodes */
        for (let i = 0; i < nodes.length; i++) {
            const n  = nodes[i];
            const wv = Math.sin(t * 0.001 * n.speed + n.phase) * 0.08;
            const p  = project(n.x3, n.y3 + wv, n.z3, t);
            const col = i % COLS, row = Math.floor(i / COLS);

            if (col < COLS - 1) {
                const n2 = nodes[i + 1];
                const w2 = Math.sin(t * 0.001 * n2.speed + n2.phase) * 0.08;
                const p2 = project(n2.x3, n2.y3 + w2, n2.z3, t);
                const g  = ctx.createLinearGradient(p.x, p.y, p2.x, p2.y);
                g.addColorStop(0, `rgba(0,245,255,${0.045 * p.s})`);
                g.addColorStop(1, `rgba(0,100,255,${0.045 * p2.s})`);
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = g; ctx.lineWidth = 0.5; ctx.stroke();
            }
            if (row < ROWS - 1) {
                const n2 = nodes[i + COLS];
                const w2 = Math.sin(t * 0.001 * n2.speed + n2.phase) * 0.08;
                const p2 = project(n2.x3, n2.y3 + w2, n2.z3, t);
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(0,80,200,${0.038 * p.s})`; ctx.lineWidth = 0.5; ctx.stroke();
            }

            const nr = (n.active ? 3 : 1.5) * p.s;
            if (n.active) {
                const gw = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, nr * 5);
                gw.addColorStop(0, `rgba(0,245,255,${0.45 * p.s})`);
                gw.addColorStop(1, 'transparent');
                ctx.beginPath(); ctx.arc(p.x, p.y, nr * 4.5, 0, Math.PI * 2);
                ctx.fillStyle = gw; ctx.fill();
            }
            ctx.beginPath(); ctx.arc(p.x, p.y, nr, 0, Math.PI * 2);
            ctx.fillStyle = n.active ? `rgba(0,245,255,${0.85 * p.s})` : `rgba(0,100,255,${0.28 * p.s})`;
            ctx.fill();
        }

        /* Data packet */
        const pp  = (t * 0.00038) % 1;
        const pi  = Math.floor(pp * (COLS - 1));
        const row = Math.floor(t * 0.00019) % ROWS;
        if (pi < COLS - 1) {
            const n1 = nodes[row * COLS + pi];
            const n2 = nodes[row * COLS + pi + 1];
            const frac = (pp * (COLS - 1)) - pi;
            const w1 = Math.sin(t * 0.001 * n1.speed + n1.phase) * 0.08;
            const w2 = Math.sin(t * 0.001 * n2.speed + n2.phase) * 0.08;
            const p1 = project(n1.x3, n1.y3 + w1, n1.z3, t);
            const p2 = project(n2.x3, n2.y3 + w2, n2.z3, t);
            const px = p1.x + (p2.x - p1.x) * frac;
            const py = p1.y + (p2.y - p1.y) * frac;
            const gw = ctx.createRadialGradient(px, py, 0, px, py, 12);
            gw.addColorStop(0, 'rgba(0,255,136,0.85)');
            gw.addColorStop(1, 'transparent');
            ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI * 2);
            ctx.fillStyle = gw; ctx.fill();
            ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#00ff88'; ctx.fill();
        }

        /* Hex particles */
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.rot += 0.004;
            if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
            ctx.save(); ctx.globalAlpha = p.alpha;
            ctx.strokeStyle = '#00f5ff'; ctx.lineWidth = 0.7;
            if (p.hex) {
                drawHex(p.x, p.y, p.size, p.rot); ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(p.x - p.size, p.y); ctx.lineTo(p.x + p.size, p.y);
                ctx.moveTo(p.x, p.y - p.size); ctx.lineTo(p.x, p.y + p.size);
                ctx.stroke();
            }
            ctx.restore();
        });

        /* Scan line */
        scanY = (scanY + 0.6) % H;
        const sg = ctx.createLinearGradient(0, scanY - 70, 0, scanY + 4);
        sg.addColorStop(0, 'transparent');
        sg.addColorStop(0.8, 'rgba(0,245,255,0.02)');
        sg.addColorStop(1,   'rgba(0,245,255,0.055)');
        ctx.fillStyle = sg;
        ctx.fillRect(0, scanY - 70, W, 74);

        /* Vignette */
        const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.88);
        vig.addColorStop(0, 'transparent');
        vig.addColorStop(1, 'rgba(0,0,0,0.62)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);

        requestAnimationFrame(draw);
    }

    initGrid();
    initParticles();
    requestAnimationFrame(draw);
})();

/* ── 3D card mouse tilt ──────────────────────────── */
const loginCard = document.getElementById('loginCard');
document.addEventListener('mousemove', e => {
    const r  = loginCard.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width  / 2)) / (window.innerWidth  / 2);
    const dy = (e.clientY - (r.top  + r.height / 2)) / (window.innerHeight / 2);
    loginCard.style.transform = `rotateY(${dx * 5}deg) rotateX(${-dy * 3.5}deg)`;
});
document.addEventListener('mouseleave', () => {
    loginCard.style.transform = '';
});

/* ── HUD ──────────────────────────────────────────── */
let threats   = Math.floor(Math.random() * 900) + 300;
const startTs = Date.now();
document.getElementById('hud-threats').textContent = threats.toLocaleString();
setInterval(() => {
    const e = Date.now() - startTs;
    const h = String(Math.floor(e / 3600000)).padStart(2,'0');
    const m = String(Math.floor((e % 3600000) / 60000)).padStart(2,'0');
    const s = String(Math.floor((e % 60000) / 1000)).padStart(2,'0');
    document.getElementById('hud-uptime').textContent = `${h}:${m}:${s}`;
    if (Math.random() < 0.04) {
        threats++;
        document.getElementById('hud-threats').textContent = threats.toLocaleString();
    }
}, 1000);

/* ── Google Auth ──────────────────────────────────── */
const CLIENT_ID = "93245967028-gvs3jtmhmep0mlc72n3t18mifp2d52pr.apps.googleusercontent.com";
let currentCredential = null;

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
}
function hideError() { document.getElementById('error-msg').style.display = 'none'; }

function waitForGoogle(cb, tries) {
    tries = tries || 0;
    if (tries > 50) { showError("Google SDK failed to load. Please refresh."); return; }
    if (typeof google !== 'undefined' && google.accounts && google.accounts.id) cb();
    else setTimeout(() => waitForGoogle(cb, tries + 1), 100);
}

function startGoogleLogin() {
    hideError();
    waitForGoogle(() => {
        google.accounts.id.initialize({
            client_id: CLIENT_ID,
            callback: handleCredentialResponse,
            auto_select: false,
            ux_mode: "popup",
            cancel_on_tap_outside: true
        });
        const hiddenBtn = document.querySelector('#hidden-g-btn div[role="button"]');
        if (hiddenBtn) {
            hiddenBtn.click();
        } else {
            google.accounts.id.prompt(n => {
                if (n.isNotDisplayed() || n.isSkippedMoment())
                    showError("Popup blocked. Allow popups and try again.");
            });
        }
    });
}

function handleCredentialResponse(response) {
    if (!response || !response.credential) { showError("Google Sign-In failed. Try again."); return; }
    currentCredential = response.credential;
    const payload = parseJwt(response.credential);
    document.getElementById('google-btn').style.display = 'none';
    hideError();
    const card = document.getElementById('selected-account-card');
    card.style.display = 'flex';
    document.getElementById('acc-avatar').src   = payload.picture || '';
    document.getElementById('acc-name').textContent  = payload.name  || '';
    document.getElementById('acc-email').textContent = payload.email || '';
    document.getElementById('google-continue-btn').style.display = 'block';
}

function submitToken() {
    if (!currentCredential) return;
    const btn = document.getElementById('google-continue-btn');
    btn.textContent = '▶ AUTHENTICATING...';
    btn.disabled = true;
    fetch("/google-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: currentCredential })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            window.location.href = "/scan";
        } else {
            showError("Authentication failed: " + (data.message || "Please try again."));
            btn.textContent = '▶ CONTINUE';
            btn.disabled = false;
        }
    })
    .catch(() => {
        showError("Network error. Check your connection.");
        btn.textContent = '▶ CONTINUE';
        btn.disabled = false;
    });
}

function changeAccount() {
    currentCredential = null;
    document.getElementById('google-btn').style.display = 'flex';
    document.getElementById('selected-account-card').style.display = 'none';
    const cb = document.getElementById('google-continue-btn');
    cb.style.display = 'none';
    cb.textContent = '▶ CONTINUE';
    cb.disabled = false;
    hideError();
    startGoogleLogin();
}

function parseJwt(token) {
    try {
        return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    } catch(e) { return {}; }
}
